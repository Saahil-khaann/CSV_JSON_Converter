services:
  - type: web
    name: csv-pickle-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: STORAGE_DIR
        value: ./storage
      - key: DATABASE_URL
        value: sqlite:///./app.db
